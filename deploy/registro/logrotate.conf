# /etc/logrotate.d/registro-anonimo en la Pi (lo copia Furbex desde narbigcito.github.io/deploy/registro).
# Logs del registro anónimo: sin IP ni nada personal, así que se guardan dos años.
# Van en /var/log/nginx/registro/ para que el glob de /etc/logrotate.d/nginx (*.log, 14 días)
# no los tome. El lector (piezas/js/registro-anonimo/lector/visitas.py --ssh) ya lee los rotados.
/var/log/nginx/registro/*.log {
	weekly
	missingok
	rotate 104
	compress
	delaycompress
	notifempty
	create 0640 www-data adm
	sharedscripts
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
