# narbigcito.com: receptor del registro anónimo (pieza registro-anonimo).
# GENERADO por deploy/registro/armar.sh en narbigcito.github.io; no editar a mano.
# Va en /etc/nginx/sites-available/registro con su symlink en sites-enabled.
# Log: /var/log/nginx/registro/narbigcito-eventos.log (hora país sitio visita orden evento dato;
# sin IP). Su rotación es deploy/registro/logrotate.conf (dos años), no la de nginx (14 días).

# registro-anonimo: receptor «narbigcito» (generado por piezas/js/registro-anonimo/armar-nginx.js; no editar a mano).
# Sitios: narbigcito. Formato: hora país sitio visita orden evento dato. Sin IP.
map "$arg_w|$arg_n|$arg_d" $ra_narbigcito_pareja {
    default 0;
    "narbigcito|entra|es" 1;
    "narbigcito|entra|en" 1;
    "narbigcito|seccion|eventos" 1;
    "narbigcito|seccion|quien" 1;
    "narbigcito|seccion|arena" 1;
    "narbigcito|seccion|substack" 1;
    "narbigcito|seccion|creo" 1;
    "narbigcito|seccion|apps" 1;
    "narbigcito|seccion|convs" 1;
    "narbigcito|seccion|conectar" 1;
    "narbigcito|lee|pagina.25" 1;
    "narbigcito|lee|pagina.50" 1;
    "narbigcito|lee|pagina.75" 1;
    "narbigcito|lee|pagina.100" 1;
    "narbigcito|lee|creo.25" 1;
    "narbigcito|lee|creo.50" 1;
    "narbigcito|lee|creo.75" 1;
    "narbigcito|lee|creo.100" 1;
    "narbigcito|substack|post-1" 1;
    "narbigcito|substack|post-2" 1;
    "narbigcito|substack|post-3" 1;
    "narbigcito|substack|post-4" 1;
    "narbigcito|substack|post-5" 1;
    "narbigcito|arena|bloque" 1;
    "narbigcito|proyecto|logos" 1;
    "narbigcito|proyecto|magi" 1;
    "narbigcito|proyecto|whelle" 1;
    "narbigcito|proyecto|rana" 1;
    "narbigcito|conversacion|conv-1" 1;
    "narbigcito|conversacion|conv-2" 1;
    "narbigcito|conversacion|conv-3" 1;
    "narbigcito|conversacion|archivo" 1;
    "narbigcito|red|agenda" 1;
    "narbigcito|red|instagram" 1;
    "narbigcito|red|substack" 1;
    "narbigcito|red|github" 1;
    "narbigcito|red|linkedin" 1;
    "narbigcito|red|arena" 1;
    "narbigcito|red|otro" 1;
    "narbigcito|mas|substack" 1;
    "narbigcito|mas|arena" 1;
    "narbigcito|eventos|abre" 1;
    "narbigcito|muro|roto" 1;
    "narbigcito|huevo|leche" 1;
    "narbigcito|huevo|konami" 1;
    "narbigcito|idioma|es" 1;
    "narbigcito|idioma|en" 1;
    "narbigcito|sale|0-30s" 1;
    "narbigcito|sale|30s-2m" 1;
    "narbigcito|sale|2-5m" 1;
    "narbigcito|sale|5-15m" 1;
    "narbigcito|sale|15-30m" 1;
    "narbigcito|sale|mas-30m" 1;
}
map $arg_s $ra_narbigcito_visita {
    default 0;
    "~^[0-9a-f]{12}$" 1;
}
map $arg_i $ra_narbigcito_orden {
    default 0;
    "~^[0-9]{1,4}$" 1;
}
map "$ra_narbigcito_pareja$ra_narbigcito_visita$ra_narbigcito_orden" $ra_narbigcito_ok {
    default 0;
    111 1;
}
map $http_cf_ipcountry $ra_narbigcito_pais {
    default "--";
    "~^(?<cc>[A-Z0-9]{2})$" $cc;
}
log_format ra_narbigcito '$time_iso8601 $ra_narbigcito_pais $arg_w $arg_s $arg_i $arg_n $arg_d';
server {
    listen 127.0.0.1:3001;
    server_name analytics.narbigcito.com;
    access_log off;
    error_log /dev/null crit;

    # registro-anonimo «narbigcito»: responde vacío y anota solo lo que pasa la aduana, sin IP.
    location = /e.txt {
        access_log /var/log/nginx/registro/narbigcito-eventos.log ra_narbigcito if=$ra_narbigcito_ok;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 204;
    }
    location / {
        return 404;
    }
}
